group 'com.liatofer.whatsapp_stickers_injector'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '2.1.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.6.0'
        // KGP stays on the buildscript classpath even though this script never
        // applies it: on AGP < 9 the Flutter tool applies KGP to this project
        // and resolves it from here.
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

// This script must not apply the Kotlin Gradle Plugin (KGP), not even
// conditionally: the Flutter tool decides whether to provide Kotlin for this
// project by statically scanning this file for an `apply plugin:
// 'kotlin-android'` line, so a runtime conditional still matches the scan and
// makes the tool skip us -- leaving the project with no Kotlin plugin at all
// on AGP 9+, where the conditional itself is false. Flutter provides Kotlin
// either way: AGP's built-in Kotlin on AGP 9+, and an auto-applied KGP on
// older AGP (requires Flutter >= 3.44). See
// https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin/for-plugin-authors

android {
    namespace = "com.liatofer.whatsapp_stickers_injector"
    compileSdkVersion 34

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    defaultConfig {
        minSdkVersion 19
    }
    lintOptions {
        disable 'InvalidPackage'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

// The kotlin {} extension exists on both paths: registered by the KGP the
// Flutter tool applies on AGP < 9, and by AGP's built-in Kotlin on 9+.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}
